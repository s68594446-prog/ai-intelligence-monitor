name: daily-digest

on:
  schedule:
    - cron: "30 22 * * *" # 22:30 UTC = 北京时间每天 6:30 (Asia/Shanghai, 次日)
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the same-day guard and regenerate. Content-keyed email idempotency still prevents an identical resend."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Idempotency guard: runs BEFORE install/discovery/DeepSeek. If today's
      # Asia/Shanghai digest is already delivered (a committed ledger record with
      # day == today AND status == SENT), skip the whole pipeline so a second
      # same-day run cannot overwrite the archive or send a second email.
      #
      # Judged DAY-level (independent of digest content), unlike the send
      # script's content-keyed idempotency in email_digest.py — that is exactly
      # why 2026-07-27's two runs each sent a mail; this closes that.
      #
      # KNOWN EDGE: the separate manual email-digest workflow has its own
      # concurrency group. A manual send can therefore race this workflow. The
      # content-keyed ledger is the final duplicate-send guard.
      #  * Digest file exists but has no SENT record (a prior send failed): the
      #    guard sees no SENT and proceeds to regenerate/overwrite/re-send. This
      #    is accepted for now — we would rather re-send than silently drop a day.
      #
      # fail-soft: if the ledger cannot be read/parsed, we DO NOT skip — we
      # proceed (rather re-send than lose a real day) and mark a red ::warning::;
      # a skip only ever happens on a positive, parsed SENT hit.
      - name: Idempotency guard (skip if today already delivered)
        id: guard
        shell: bash
        run: |
          set -o pipefail
          set +e   # we branch on the guard's decision, not on exit status
          DAY=$(TZ=Asia/Shanghai date +%F)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          FORCE="${{ github.event.inputs.force }}"   # empty on schedule => not forced
          if [ "$FORCE" = "true" ]; then
            echo "FORCE=true: bypassing idempotency guard; full pipeline will run (may OVERWRITE archive and RE-SEND)."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LEDGER="digests/.email-log.jsonl"
          DECISION=$(GUARD_DAY="$DAY" python3 - "$LEDGER" <<'PY'
          import json, os, sys
          day = os.environ["GUARD_DAY"]
          path = sys.argv[1]
          def log(msg): print(msg, file=sys.stderr)
          try:
              with open(path, encoding="utf-8") as fh:
                  lines = [ln for ln in fh if ln.strip()]
          except FileNotFoundError:
              log(f"GUARD: ledger {path} not found -> treat as NOT delivered, proceeding.")
              print("PROCEED"); sys.exit(0)
          except OSError as exc:
              log(f"GUARD-ERROR: cannot read ledger ({exc}) -> fail-soft, proceeding. ANOMALY.")
              print("PROCEED_ANOMALY"); sys.exit(0)
          hit, bad = None, 0
          for ln in lines:
              try:
                  entry = json.loads(ln)
              except ValueError:
                  bad += 1
                  continue
              if entry.get("day") == day and entry.get("status") == "SENT":
                  hit = entry
                  break
          if bad:
              log(f"GUARD-WARN: {bad} unparseable ledger line(s) skipped.")
          if hit is not None:
              log(f"SKIP: digest for {day} already delivered (ledger key={hit.get('idempotency_key')}), skipping regenerate/commit/email.")
              print("SKIP"); sys.exit(0)
          log(f"GUARD: no SENT record for {day} -> proceeding with full pipeline.")
          print("PROCEED")
          PY
          )
          echo "guard decision: '${DECISION}'"
          case "$DECISION" in
            SKIP)
              echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            PROCEED)
              echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            PROCEED_ANOMALY)
              echo "::warning::Idempotency guard hit a ledger read error; proceeding fail-soft (may double-send). Investigate digests/.email-log.jsonl."
              echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::warning::Idempotency guard produced no decision (script/parse failure); proceeding fail-soft (may double-send)."
              echo "skip=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Install backend
        if: steps.guard.outputs.skip != 'true'
        working-directory: ai-intelligence-monitor/backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run daily digest (RSS + Juhe discovery, safe fetch, DeepSeek, render)
        if: steps.guard.outputs.skip != 'true'
        working-directory: ai-intelligence-monitor/backend
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          JUHE_HEADLINES_ENABLED: "true"
          JUHE_HEADLINES_API_KEY: ${{ secrets.JUHE_HEADLINES_API_KEY }}
          JUHE_AI_BRIEF_ENABLED: "true"
          JUHE_AI_BRIEF_API_KEY: ${{ secrets.JUHE_AI_BRIEF_API_KEY }}
        # Scaled budgets: up to 50 page fetches and 35 DeepSeek calls per run
        # across both boards, 48h freshness window.
        run: python -m app.scripts.daily_global_ai --rss --juhe --fetch --analyze --render --max-fetch 50 --max-analyze 35 --lookback-hours 48
      - name: Upload full run artifacts (audit trail)
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: daily-run-${{ github.run_id }}
          path: ai-intelligence-monitor/runs/
          retention-days: 90
      # The generator deliberately exits zero after writing a complete audit,
      # even when Ops fails. Make that business result an explicit CI gate after
      # the always-run artifact upload. Nothing below this step may publish or
      # deliver a failed digest.
      - name: Verify digest Ops Gate
        if: steps.guard.outputs.skip != 'true'
        working-directory: ai-intelligence-monitor/backend
        run: python -m app.scripts.verify_daily_digest_ops
      - name: Prepare audited digest for delivery
        if: steps.guard.outputs.skip != 'true'
        run: |
          DIGEST=$(ls -d ai-intelligence-monitor/runs/*-daily-ai/04-digest.txt 2>/dev/null | tail -1)
          if [ -z "$DIGEST" ]; then
            echo "no digest produced; skipping commit"
            exit 0
          fi
          DAY=$(TZ=Asia/Shanghai date +%F)
          mkdir -p digests
          cp "$DIGEST" "digests/${DAY}.md"
          RUN_DIR=$(dirname "$DIGEST")
          {
            echo ""
            echo "---"
            echo "## 审计（本次 run 自报告）"
          } >> "digests/${DAY}.md"
          for AUDIT in ops.json analysis-failures.json; do
            if [ -f "$RUN_DIR/$AUDIT" ]; then
              {
                echo ""
                echo "### $AUDIT"
                echo '```json'
                cat "$RUN_DIR/$AUDIT"
                echo '```'
              } >> "digests/${DAY}.md"
            fi
          done
          if [ -f "$RUN_DIR/02-fetch.json" ]; then
            {
              echo ""
              echo "### blocked"
              echo '```json'
              python -c "import json,sys;print(json.dumps(json.load(open(sys.argv[1])).get('blocked',[]),ensure_ascii=False,indent=2))" "$RUN_DIR/02-fetch.json"
              echo '```'
            } >> "digests/${DAY}.md"
          fi
      - name: Email the digest (Gate-checked; sends only if Ops passed)
        if: steps.guard.outputs.skip != 'true'
        working-directory: ai-intelligence-monitor/backend
        env:
          EMAIL_DELIVERY_ENABLED: "true"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: STARTTLS
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        # Any Gate block or SMTP failure is an automation failure. Do not turn a
        # business-level BLOCKED result into a green GitHub run.
        run: python -m app.scripts.send_digest_email --send
      - name: Commit delivered digest and email ledger
        if: steps.guard.outputs.skip != 'true'
        run: |
          DAY=$(TZ=Asia/Shanghai date +%F)
          if [ -z "$(git status --porcelain -- "digests/${DAY}.md" digests/.email-log.jsonl)" ]; then
            echo "no digest or ledger change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "digests/${DAY}.md" digests/.email-log.jsonl
          git commit -m "digest: ${DAY} + email ledger"
          git pull --rebase origin main
          git push origin main
