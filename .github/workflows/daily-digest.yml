name: daily-digest

on:
  schedule:
    - cron: "30 22 * * *" # 22:30 UTC = 北京时间每天 6:30 (Asia/Shanghai, 次日)
  workflow_dispatch:
    inputs:
      force:
        description: "Regeneration is available in dry-run mode; never overrides the delivery day guard."
        type: boolean
        default: false
      send_email:
        description: "Actually send after Ops passes. Manual runs default to a full dry-run."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Read-only day guard; --force never bypasses SENT/PENDING/UNKNOWN.
      - name: Idempotency guard (skip if today already delivered)
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          DAY=$(TZ=Asia/Shanghai date +%F)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          SEND_EMAIL="${{ github.event_name == 'schedule' || inputs.send_email == true }}"
          echo "send_email=$SEND_EMAIL" >> "$GITHUB_OUTPUT"
          if [ "$SEND_EMAIL" != "true" ]; then
            echo "Manual dry-run: generation only; no ledger mutation or sending."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DIGEST_DAY="$DAY" python .github/scripts/digest_guard.py
      - name: Install backend
        if: steps.guard.outputs.skip != 'true'
        working-directory: ai-intelligence-monitor/backend
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock -r requirements-build.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Validate SMTP configuration (no network)
        id: smtp-config
        if: steps.guard.outputs.skip != 'true'
        working-directory: ai-intelligence-monitor/backend
        env:
          EMAIL_DELIVERY_ENABLED: "true"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: STARTTLS
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: python -m app.scripts.validate_smtp_config
      - name: Run daily digest (RSS + Juhe discovery, safe fetch, Gemini, render)
        id: generation
        if: steps.guard.outputs.skip != 'true'
        working-directory: ai-intelligence-monitor/backend
        env:
          DIGEST_DAY: ${{ steps.guard.outputs.day }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_ANALYSIS_MODEL: ${{ vars.GEMINI_ANALYSIS_MODEL || 'gemini-3.5-flash' }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.5-flash-lite' }}
          GEMINI_QUOTA_FALLBACK_ENABLED: ${{ vars.GEMINI_QUOTA_FALLBACK_ENABLED || 'true' }}
          GEMINI_SERVER_FALLBACK_ENABLED: ${{ vars.GEMINI_SERVER_FALLBACK_ENABLED || 'true' }}
          GEMINI_BASE_URL: ${{ vars.GEMINI_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta' }}
          GEMINI_MIN_REQUEST_INTERVAL_SECONDS: ${{ vars.GEMINI_MIN_REQUEST_INTERVAL_SECONDS || '4.1' }}
          GEMINI_RATE_LIMIT_COOLDOWN_SECONDS: ${{ vars.GEMINI_RATE_LIMIT_COOLDOWN_SECONDS || '60' }}
          GEMINI_MAX_RUN_SECONDS: ${{ vars.GEMINI_MAX_RUN_SECONDS || '2400' }}
          LLM_TIMEOUT_SECONDS: ${{ vars.GEMINI_ANALYSIS_TIMEOUT_SECONDS || '120' }}
          SMTP_CONFIGURATION_PREVALIDATED: ${{ steps.smtp-config.outputs.valid }}
          JUHE_HEADLINES_ENABLED: "true"
          JUHE_HEADLINES_API_KEY: ${{ secrets.JUHE_HEADLINES_API_KEY }}
          JUHE_AI_BRIEF_ENABLED: "true"
          JUHE_AI_BRIEF_API_KEY: ${{ secrets.JUHE_AI_BRIEF_API_KEY }}
        # Cover every successfully fetched candidate (at most 50), plus 15
        # bounded requests for recovery / quota fallback. Do not truncate the
        # candidate pool to make coverage pass. The 2400s deadline still applies.
        run: python -m app.scripts.daily_global_ai --rss --juhe --fetch --analyze --render --max-fetch 50 --max-provider-requests 65 --lookback-hours 48 --day "$DIGEST_DAY"
      - name: Upload full run artifacts (audit trail)
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: daily-run-${{ github.run_id }}
          path: ai-intelligence-monitor/runs/
          retention-days: 90
      # The generator deliberately exits zero after writing a complete audit,
      # even when Ops fails. Make that business result an explicit CI gate after
      # the always-run artifact upload. Nothing below this step may publish or
      # deliver a failed digest.
      - name: Verify digest Ops Gate
        if: steps.guard.outputs.skip != 'true'
        working-directory: ai-intelligence-monitor/backend
        env:
          DAILY_RUN_DIR: ${{ steps.generation.outputs.run_dir }}
          DIGEST_DAY: ${{ steps.guard.outputs.day }}
        run: python -m app.scripts.verify_daily_digest_ops
      - name: Prepare audited digest for delivery
        if: steps.guard.outputs.skip != 'true'
        env:
          DAILY_RUN_DIR: ${{ steps.generation.outputs.run_dir }}
          DIGEST_DAY: ${{ steps.guard.outputs.day }}
        run: |
          DIGEST="${DAILY_RUN_DIR:?generation run missing}/04-digest.txt"
          if [ ! -f "$DIGEST" ]; then
            echo "::error::No current-run digest produced; delivery blocked"
            exit 1
          fi
          DAY="$DIGEST_DAY"
          mkdir -p digests
          cp "$DIGEST" "digests/${DAY}.md"
          RUN_DIR=$(dirname "$DIGEST")
          {
            echo ""
            echo "---"
            echo "## 审计（本次 run 自报告）"
          } >> "digests/${DAY}.md"
          for AUDIT in ops.json analysis-failures.json; do
            if [ -f "$RUN_DIR/$AUDIT" ]; then
              {
                echo ""
                echo "### $AUDIT"
                echo '```json'
                cat "$RUN_DIR/$AUDIT"
                echo '```'
              } >> "digests/${DAY}.md"
            fi
          done
          if [ -f "$RUN_DIR/02-fetch.json" ]; then
            {
              echo ""
              echo "### blocked"
              echo '```json'
              python -c "import json,sys;print(json.dumps(json.load(open(sys.argv[1])).get('blocked',[]),ensure_ascii=False,indent=2))" "$RUN_DIR/02-fetch.json"
              echo '```'
            } >> "digests/${DAY}.md"
          fi
      - name: Email the digest (Gate-checked; sends only if Ops passed)
        id: email
        if: steps.guard.outputs.skip != 'true'
        working-directory: ai-intelligence-monitor/backend
        env:
          DIGEST_DAY: ${{ steps.guard.outputs.day }}
          EMAIL_DELIVERY_ENABLED: "true"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: STARTTLS
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        # Scheduled runs send. Manual runs default to READY dry-run and touch no
        # SMTP server or send ledger unless send_email=true was explicit.
        run: |
          if [ "${{ steps.guard.outputs.send_email }}" = "true" ]; then
            python -m app.scripts.send_digest_email --day "$DIGEST_DAY" --send
          else
            python -m app.scripts.send_digest_email --day "$DIGEST_DAY"
          fi
      - name: Persist accepted delivery ledger
        if: steps.email.outputs.delivery_status == 'SENT'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/.email-log.jsonl
          git commit -m "email: persist SMTP acceptance before digest archive"
          git pull --rebase --autostash origin main
          git push origin main
      - name: Update published source history (URL and content hash only)
        if: steps.email.outputs.delivery_status == 'SENT'
        working-directory: ai-intelligence-monitor/backend
        env:
          DAILY_RUN_DIR: ${{ steps.generation.outputs.run_dir }}
        run: |
          ARTIFACT="${DAILY_RUN_DIR:?generation run missing}/published-source-history.json"
          if [ ! -f "$ARTIFACT" ]; then
            echo "published source history artifact missing"
            exit 1
          fi
          python -m app.scripts.update_digest_source_history \
            --artifact "$ARTIFACT" \
            --history ../../digests/.source-history.jsonl
      - name: Preserve delivery attempt ledger on failure
        if: failure() && steps.guard.outputs.send_email == 'true'
        run: |
          if [ -z "$(git status --porcelain -- digests/.email-log.jsonl)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/.email-log.jsonl
          git commit -m "email: preserve failed or uncertain delivery attempt"
          git pull --rebase --autostash origin main
          git push origin main
      - name: Commit delivered digest and email ledger
        if: steps.email.outputs.delivery_status == 'SENT'
        env:
          DIGEST_DAY: ${{ steps.guard.outputs.day }}
        run: |
          DAY="$DIGEST_DAY"
          if [ -z "$(git status --porcelain -- "digests/${DAY}.md" digests/.email-log.jsonl digests/.source-history.jsonl)" ]; then
            echo "no digest or ledger change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "digests/${DAY}.md" digests/.email-log.jsonl digests/.source-history.jsonl
          git commit -m "digest: ${DAY} + email ledger"
          git pull --rebase origin main
          git push origin main
