name: daily-digest

on:
  schedule:
    - cron: "0 0 * * *" # 00:00 UTC = 08:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend
        working-directory: ai-intelligence-monitor/backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run daily digest (RSS + Juhe discovery, safe fetch, DeepSeek, render)
        working-directory: ai-intelligence-monitor/backend
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          JUHE_HEADLINES_ENABLED: "true"
          JUHE_HEADLINES_API_KEY: ${{ secrets.JUHE_HEADLINES_API_KEY }}
          JUHE_AI_BRIEF_ENABLED: "true"
          JUHE_AI_BRIEF_API_KEY: ${{ secrets.JUHE_AI_BRIEF_API_KEY }}
        # Scaled budgets: up to 50 page fetches and 35 DeepSeek calls per run
        # across both boards, 48h freshness window.
        run: python -m app.scripts.daily_global_ai --rss --juhe --fetch --analyze --render --max-fetch 50 --max-analyze 35 --lookback-hours 48
      - name: Upload full run artifacts (audit trail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-run-${{ github.run_id }}
          path: ai-intelligence-monitor/runs/
          retention-days: 90
      - name: Commit digest back to repository
        run: |
          DIGEST=$(ls -d ai-intelligence-monitor/runs/*-daily-ai/04-digest.txt 2>/dev/null | tail -1)
          if [ -z "$DIGEST" ]; then
            echo "no digest produced; skipping commit"
            exit 0
          fi
          DAY=$(TZ=Asia/Shanghai date +%F)
          mkdir -p digests
          cp "$DIGEST" "digests/${DAY}.md"
          RUN_DIR=$(dirname "$DIGEST")
          {
            echo ""
            echo "---"
            echo "## 审计（本次 run 自报告）"
          } >> "digests/${DAY}.md"
          for AUDIT in ops.json analysis-failures.json; do
            if [ -f "$RUN_DIR/$AUDIT" ]; then
              {
                echo ""
                echo "### $AUDIT"
                echo '```json'
                cat "$RUN_DIR/$AUDIT"
                echo '```'
              } >> "digests/${DAY}.md"
            fi
          done
          if [ -f "$RUN_DIR/02-fetch.json" ]; then
            {
              echo ""
              echo "### blocked"
              echo '```json'
              python -c "import json,sys;print(json.dumps(json.load(open(sys.argv[1])).get('blocked',[]),ensure_ascii=False,indent=2))" "$RUN_DIR/02-fetch.json"
              echo '```'
            } >> "digests/${DAY}.md"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests
          git commit -m "digest: ${DAY}" || { echo "nothing to commit"; exit 0; }
          git pull --rebase origin main
          git push origin main
