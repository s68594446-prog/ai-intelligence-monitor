name: backend-ci

on:
  workflow_dispatch:
  push:
    paths:
      - "ai-intelligence-monitor/backend/**"
      - ".github/workflows/**"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "ai-intelligence-monitor/backend/**"
      - ".github/workflows/**"
      - ".github/scripts/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            ai-intelligence-monitor/backend/requirements-dev.lock
            ai-intelligence-monitor/backend/requirements-build.lock
      - name: Install backend and test dependencies
        working-directory: ai-intelligence-monitor/backend
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock -r requirements-build.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Run offline backend tests
        working-directory: ai-intelligence-monitor/backend
        env:
          GEMINI_API_KEY: ""
          DEEPSEEK_API_KEY: ""
          OPENAI_API_KEY: ""
        run: python -m pytest -q
