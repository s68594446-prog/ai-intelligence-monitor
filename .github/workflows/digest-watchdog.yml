name: digest-watchdog

on:
  schedule:
    - cron: "30 1 * * *" # 09:30 Asia/Shanghai; original digest time is unchanged
  workflow_run:
    workflows: [daily-digest, email-digest]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-digest-watchdog
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Inspect generation, review, delivery and archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/digest_watchdog.py
      - name: Upload sanitized watchdog result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: digest-watchdog-${{ github.run_id }}
          path: watchdog-report.json
          retention-days: 30
