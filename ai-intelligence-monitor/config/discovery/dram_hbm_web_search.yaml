  - {id: dram_pricing_en, variable: DRAM pricing, purpose: contract and spot price evidence, language: en, time_range: 14d, query: 'DRAM DDR5 LPDDR GDDR contract price spot price official'}
  - {id: dram_pricing_cn, variable: DRAM pricing, purpose: Chinese-language contract and spot price evidence, language: zh, time_range: 14d, query: 'DRAM DDR5 LPDDR GDDR 合约价 现货价'}
