  - {id: samsung_en, variable: manufacturer capital expenditure, purpose: Samsung memory guidance and capital discipline, language: en, time_range: 30d, query: 'site:samsung.com HBM DRAM capex capacity production guidance'}
  - {id: skhynix_en, variable: manufacturer capital expenditure, purpose: SK hynix memory guidance and capital discipline, language: en, time_range: 30d, query: 'site:skhynix.com HBM DRAM capex capacity production guidance'}
  - {id: cxmt_cn, variable: capacity, purpose: CXMT effective capacity reverse trigger, language: zh, time_range: 90d, query: '长鑫存储 CXMT DRAM 产能 扩产 投产 监管'}
  - {id: nvidia_rubin_en, variable: NVIDIA GPU demand, purpose: Blackwell and Rubin deployment sentinel, language: en, time_range: 30d, query: 'site:nvidia.com Blackwell Rubin deployment production systems demand'}
  - {id: cloud_capex_en, variable: cloud provider CapEx, purpose: cloud CapEx reverse trigger, language: en, time_range: 30d, query: 'cloud provider capital expenditure AI infrastructure official earnings capex'}
  - {id: cloud_capex_cn, variable: cloud provider CapEx, purpose: Chinese-language cloud CapEx disclosures, language: zh, time_range: 30d, query: '云厂商 资本开支 AI基础设施 财报 官方'}
