  - {id: cowos_en, variable: CoWoS capacity, purpose: advanced packaging dependency sentinel, language: en, time_range: 30d, query: 'TSMC CoWoS capacity expansion production official'}
  - {id: export_controls_en, variable: semiconductor export policy, purpose: export-control and regulatory changes, language: en, time_range: 30d, query: 'semiconductor export controls AI accelerators memory official regulation'}
  - {id: export_controls_cn, variable: semiconductor export policy, purpose: Chinese-language regulatory changes, language: zh, time_range: 30d, query: '半导体 出口管制 AI加速器 存储器 监管 原文'}
