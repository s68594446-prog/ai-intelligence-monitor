version: daily-ai-rss-sources-v3
# Supply-chain edition. Every feed marked verified returned 200 with a valid
# RSS/Atom body on the 2026-07-23 probe. Probed and EXCLUDED (no valid public
# feed): TSMC PR (403 bot-guard), AMD newsroom rss (404), ASML news rss (404),
# Broadcom newsroom (404), TrendForce root feed (404; /news/feed works),
# AnandTech (site retired), Reuters public RSS (dead), 集微网/芯智讯/
# 半导体行业观察/EET-China (no valid endpoint), Anthropic/Meta AI (no feed),
# arXiv (dropped by design: papers have little chain-tracking value).
# prefilter:false = sector-dedicated feed; true = general feed, items must hit
# the bilingual industry keyword list. Single-feed failures are recorded
# per-feed and never abort the run.
feeds:
  # --- U.S. macro financing official sources (T1) ---
  # These feeds are routed to the isolated macro prompt. Routine auctions stay
  # below the materiality threshold. There is no fixed daily Treasury panel:
  # only a qualifying event can enter the ordinary macro-policy section.
  - {name: treasury_offering_announcements, url: 'https://treasurydirect.gov/TA_WS/securities/announced/rss', max_items: 3, prefilter: false}
  - {name: treasury_auction_results, url: 'https://treasurydirect.gov/TA_WS/securities/auctioned/rss', max_items: 3, prefilter: false}
  - {name: fed_monetary_policy, url: 'https://www.federalreserve.gov/feeds/press_monetary.xml', max_items: 3, prefilter: false}
  # --- company official / IR (T1) ---
  - {name: skhynix_news, url: 'https://news.skhynix.com/feed/', max_items: 10, prefilter: false}
  - {name: micron_ir, url: 'https://investors.micron.com/rss/news-releases.xml', max_items: 10, prefilter: false}
  - {name: nvidia_newsroom, url: 'https://nvidianews.nvidia.com/rss.xml', max_items: 10, prefilter: false}
  - {name: nvidia_blog, url: 'https://blogs.nvidia.com/feed/', max_items: 5, prefilter: false}
  # local probe hit TLS handshake timeouts on these two IR endpoints; pending
  # verification from the Actions runner, fail-soft either way:
  - {name: amd_ir, url: 'https://ir.amd.com/rss/news-releases.xml', max_items: 5, prefilter: false}
  - {name: broadcom_ir, url: 'https://investors.broadcom.com/rss/news-releases.xml', max_items: 5, prefilter: false}
  # --- international industry media (T2) ---
  - {name: digitimes, url: 'https://www.digitimes.com/rss/daily.xml', max_items: 15, prefilter: true}
  - {name: trendforce_news, url: 'https://www.trendforce.com/news/feed', max_items: 10, prefilter: true}
  - {name: semianalysis, url: 'https://www.semianalysis.com/feed', max_items: 5, prefilter: false}
  - {name: eetimes, url: 'https://www.eetimes.com/feed/', max_items: 10, prefilter: true}
  - {name: tomshardware, url: 'https://www.tomshardware.com/feeds/all', max_items: 15, prefilter: true}
  - {name: theregister, url: 'https://www.theregister.com/headlines.atom', max_items: 15, prefilter: true}
  # --- Chinese industry media (T2) ---
  - {name: mydrivers, url: 'http://rss.mydrivers.com/rss.aspx', max_items: 15, prefilter: true}
  - {name: wallstreetcn, url: 'https://dedicated.wallstreetcn.com/rss.xml', max_items: 15, prefilter: true}
  - {name: dramexchange, url: 'https://www.dramexchange.com/rss.xml', max_items: 5, prefilter: false}
  - {name: qbitai, url: 'https://www.qbitai.com/feed', max_items: 8, prefilter: true}
  # 36Kr /feed returned non-XML content on three consecutive production runs
  # (2026-08-10 through 2026-08-12). Keep it disabled until a valid official
  # feed endpoint is verified; do not treat an HTML error page as discovery.
  - {name: leiphone, url: 'https://www.leiphone.com/feed', max_items: 8, prefilter: true}
  - {name: infoq_cn, url: 'https://www.infoq.cn/feed', max_items: 5, prefilter: true}
  # Chinese hardware/industry coverage added 2026-07-26 (probe-verified 200 +
  # valid feed). General-topic feeds, so prefilter:true — the bilingual keyword
  # list already carries the CN supply-chain company names (寒武纪/长鑫/中际旭创/
  # 北方华创/中微/通富微电 …) that surface hardware items. Probed and excluded
  # (no valid feed from the runner): 财联社(405), 爱集微(non-feed), 东方财富,
  # 同花顺, 集微网/半导体行业观察/EET-China (timeout/404).
  - {name: jiemian_tech, url: 'https://a.jiemian.com/index.php?m=article&a=rss', max_items: 12, prefilter: true}
  - {name: tmtpost, url: 'https://www.tmtpost.com/feed', max_items: 10, prefilter: true}
  - {name: ithome, url: 'https://www.ithome.com/rss/', max_items: 15, prefilter: true}
  - {name: sina_tech, url: 'https://rss.sina.com.cn/tech/rollnews.xml', max_items: 12, prefilter: true}
  # --- demand-side signals, retained at reduced quota (T1/T2/T3) ---
  - {name: openai, url: 'https://openai.com/news/rss.xml', max_items: 5, prefilter: false}
  - {name: google_ai, url: 'https://blog.google/technology/ai/rss/', max_items: 5, prefilter: false}
  - {name: deepmind, url: 'https://deepmind.google/blog/rss.xml', max_items: 3, prefilter: false}
  - {name: microsoft_ai, url: 'https://news.microsoft.com/source/topics/ai/feed/', max_items: 5, prefilter: false}
  - {name: techcrunch_ai, url: 'https://techcrunch.com/category/artificial-intelligence/feed/', max_items: 5, prefilter: true}
  - {name: verge_ai, url: 'https://www.theverge.com/rss/ai-artificial-intelligence/index.xml', max_items: 5, prefilter: true}
  - {name: venturebeat_ai, url: 'https://venturebeat.com/category/ai/feed/', max_items: 5, prefilter: true}
  - {name: arstechnica_ai, url: 'https://arstechnica.com/ai/feed/', max_items: 5, prefilter: true}
  - {name: mit_tech_review, url: 'https://www.technologyreview.com/feed/', max_items: 5, prefilter: true}
  - {name: wired_ai, url: 'https://www.wired.com/feed/tag/ai/latest/rss', max_items: 5, prefilter: true}
  - {name: hackernews, url: 'https://news.ycombinator.com/rss', max_items: 10, prefilter: true}
