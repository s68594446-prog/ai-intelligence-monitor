policy_version: daily-ai-source-policy-v3
coverage_id: cn_daily_ai
# Unified global + China spectrum for the daily AI digest.
# T1: official first-party only — AI lab/company official sites, regulator
# originals, research preprint archive, exchanges and CNINFO. Suffix matching
# covers subdomains (microsoft.com covers news.microsoft.com; nvidia.com covers
# blogs.nvidia.com; gov.cn covers cac/miit/most.gov.cn; europa.eu covers
# ec.europa.eu; sse.com.cn covers www/static.sse.com.cn).
t1_domains:
  - openai.com
  - anthropic.com
  - deepmind.google
  - blog.google
  - ai.meta.com
  - microsoft.com
  - nvidia.com
  - amd.com
  - skhynix.com
