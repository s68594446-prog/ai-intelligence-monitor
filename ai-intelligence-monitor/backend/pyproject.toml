[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-intelligence-monitor"
dynamic = ["version"]
description = "Auditable intelligence monitoring with an isolated Phase 3C daily briefing"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openai>=2.20,<3",
  "pypdf>=5,<7",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
  "xlrd>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.dynamic]
version = {attr = "app.version.__version__"}

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
